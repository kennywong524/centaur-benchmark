<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="Experiment and evaluation pipeline: core models, regimes, automation and augmentation lanes, evaluator, and results aggregation">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a3db3"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e05a0a"/>
    </marker>
    <marker id="arrOrangeSm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e05a0a"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a8976"/>
    </marker>

    <g id="person">
      <circle cx="0" cy="-5.5" r="5"/>
      <path d="M-8.5 9.5 C-8.5 1.5 -4.5 0.2 0 0.2 C4.5 0.2 8.5 1.5 8.5 9.5 Z"/>
    </g>

    <g id="server">
      <rect x="-13" y="-8" width="26" height="6.4" rx="1.5"/>
      <rect x="-13" y="-0.5" width="26" height="6.4" rx="1.5"/>
      <rect x="-13" y="7" width="26" height="6.4" rx="1.5"/>
      <circle cx="-9" cy="-4.8" r="1.15" fill="#fff"/>
      <circle cx="-9" cy="2.7" r="1.15" fill="#fff"/>
      <circle cx="-9" cy="10.2" r="1.15" fill="#fff"/>
    </g>

    <g id="gavel">
      <g transform="rotate(-42)">
        <rect x="-10" y="-3.2" width="20" height="6.4" rx="1.8"/>
        <rect x="-4" y="-6.2" width="8" height="3" rx="1.2"/>
        <rect x="-4" y="3.2" width="8" height="3" rx="1.2"/>
      </g>
      <rect x="1" y="-1" width="14" height="3.2" rx="1.5" transform="rotate(42 8 0.6)"/>
      <rect x="-10" y="10" width="20" height="3.2" rx="1.4"/>
    </g>

    <g id="gear">
      <path d="M0 -13.2 L2.4 -9.6 A9.2 9.2 0 0 1 6.5 -7.8 L11.2 -9 L13.2 -4.4 L9.5 -1.9 A9.4 9.4 0 0 1 9.5 1.9 L13.2 4.4 L11.2 9 L6.5 7.8 A9.2 9.2 0 0 1 2.4 9.6 L0 13.2 L-2.4 9.6 A9.2 9.2 0 0 1 -6.5 7.8 L-11.2 9 L-13.2 4.4 L-9.5 1.9 A9.4 9.4 0 0 1 -9.5 -1.9 L-13.2 -4.4 L-11.2 -9 L-6.5 -7.8 A9.2 9.2 0 0 1 -2.4 -9.6 Z"/>
      <circle cx="0" cy="0" r="4.2" fill="#fff"/>
    </g>

    <g id="people">
      <g opacity=".72" transform="translate(7.2,-2.2) scale(.78)">
        <circle cx="0" cy="-5.5" r="5"/>
        <path d="M-8.5 9.5 C-8.5 1.5 -4.5 0.2 0 0.2 C4.5 0.2 8.5 1.5 8.5 9.5 Z"/>
      </g>
      <g transform="translate(-3.8,1)">
        <circle cx="0" cy="-5.5" r="5"/>
        <path d="M-8.5 9.5 C-8.5 1.5 -4.5 0.2 0 0.2 C4.5 0.2 8.5 1.5 8.5 9.5 Z"/>
      </g>
    </g>

    <g id="podium">
      <path d="M0 -27 L2.1 -22.2 L7.2 -21.8 L3.4 -18.4 L4.7 -13.2 L0 -16 L-4.7 -13.2 L-3.4 -18.4 L-7.2 -21.8 L-2.1 -22.2 Z" fill="#e05a0a"/>
      <rect x="-8" y="-10" width="16" height="27" rx="1.4" fill="#d92c1f"/>
      <rect x="-24" y="-2" width="16" height="19" rx="1.4" fill="#e05a0a"/>
      <rect x="8" y="3" width="16" height="14" rx="1.4" fill="#e05a0a"/>
      <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">1</text>
      <text x="-16" y="11" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">2</text>
      <text x="16" y="13.5" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">3</text>
    </g>

    <g id="iconMatrix">
      <rect x="-11" y="-11" width="22" height="22" rx="3" fill="none" stroke="#e05a0a" stroke-width="2"/>
      <line x1="-11" y1="-2.5" x2="11" y2="-2.5" stroke="#e05a0a" stroke-width="1.6"/>
      <line x1="-11" y1="5.5" x2="11" y2="5.5" stroke="#e05a0a" stroke-width="1.6"/>
      <line x1="-2.5" y1="-11" x2="-2.5" y2="11" stroke="#e05a0a" stroke-width="1.6"/>
      <line x1="5.5" y1="-11" x2="5.5" y2="11" stroke="#e05a0a" stroke-width="1.6"/>
      <rect x="-8.5" y="0.5" width="4" height="3.5" fill="#e05a0a"/>
      <rect x="1" y="-8" width="3.5" height="4" fill="#e05a0a"/>
    </g>

    <g id="iconChecklist">
      <rect x="-9" y="-12" width="18" height="24" rx="2.5" fill="none" stroke="#e05a0a" stroke-width="2"/>
      <rect x="-4.5" y="-14" width="9" height="4" rx="1.4" fill="#e05a0a"/>
      <path d="M-5 -4.5 L-3 -2.5 L0.5 -6" fill="none" stroke="#e05a0a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="3" y1="-4" x2="6.5" y2="-4" stroke="#e05a0a" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-5 2 L-3 4 L0.5 0.5" fill="none" stroke="#e05a0a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="3" y1="2.5" x2="6.5" y2="2.5" stroke="#e05a0a" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-5 8.5 L-3 10.5 L0.5 7" fill="none" stroke="#e05a0a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="3" y1="9" x2="6.5" y2="9" stroke="#e05a0a" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <g id="iconChart">
      <rect x="-10" y="2" width="5" height="9" rx="1" fill="#e05a0a"/>
      <rect x="-2.5" y="-3" width="5" height="14" rx="1" fill="#e05a0a"/>
      <rect x="5" y="-8" width="5" height="19" rx="1" fill="#d92c1f"/>
      <path d="M-9 -4 L-1 -9 L3 -7 L9 -12" fill="none" stroke="#d92c1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9 -12 l-4.2 .6 M9 -12 l-.4 4.2" fill="none" stroke="#d92c1f" stroke-width="2" stroke-linecap="round"/>
    </g>

    <clipPath id="clipCoreModels">
      <rect x="24" y="8" width="470" height="198" rx="12"/>
    </clipPath>
    <clipPath id="clipRegimes">
      <rect x="510" y="8" width="490" height="198" rx="12"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1024" height="576" fill="#ffffff"/>

  <!-- ============ Core models panel ============ -->
  <!-- Clipped fills follow rounded corners; no header junction stroke; outer stroke last -->
  <g>
    <g clip-path="url(#clipCoreModels)">
      <rect x="24" y="8" width="470" height="198" fill="#ffffff"/>
      <rect x="24" y="8" width="470" height="46" fill="#dde9f9"/>
    </g>
    <text x="259" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#142f8a">Core models</text>

    <!-- Worker model -->
    <rect x="50" y="66" width="40" height="32" rx="7" fill="#eef4fd" stroke="#c5d4f0" stroke-width="1"/>
    <use href="#person" transform="translate(70,82) scale(1)" fill="#0a3db3"/>
    <text x="104" y="79" font-size="14.5" font-weight="700" fill="#0a3db3">Worker model</text>
    <text x="226" y="79" font-size="12" fill="#2a2e36">Produces the final output for a task, either</text>
    <text x="104" y="95" font-size="12" fill="#2a2e36">directly or after receiving assistance text.</text>
    <line x1="50" y1="108" x2="468" y2="108" stroke="#e4e8f0" stroke-width="1"/>

    <!-- Assistant model -->
    <rect x="50" y="118" width="40" height="32" rx="7" fill="#eef4fd" stroke="#c5d4f0" stroke-width="1"/>
    <use href="#server" transform="translate(70,134) scale(.85)" fill="#0a3db3"/>
    <text x="104" y="131" font-size="14.5" font-weight="700" fill="#0a3db3">Assistant model</text>
    <text x="238" y="131" font-size="12" fill="#2a2e36">Provides assistance text, such as guidance</text>
    <text x="104" y="147" font-size="12" fill="#2a2e36">and checklists, to the worker model.</text>
    <line x1="50" y1="160" x2="468" y2="160" stroke="#e4e8f0" stroke-width="1"/>

    <!-- Evaluator model -->
    <rect x="50" y="170" width="40" height="32" rx="7" fill="#eef4fd" stroke="#c5d4f0" stroke-width="1"/>
    <use href="#gavel" transform="translate(70,185) scale(.82)" fill="#0a3db3"/>
    <text x="104" y="183" font-size="14.5" font-weight="700" fill="#0a3db3">Evaluator model</text>
    <text x="238" y="183" font-size="12" fill="#2a2e36">Evaluates outputs using pairwise comparisons</text>
    <text x="104" y="199" font-size="12" fill="#2a2e36">and task-specific rubric scoring.</text>

    <rect x="24" y="8" width="470" height="198" rx="12" fill="none" stroke="#b6c4e8" stroke-width="1.5"/>
  </g>

  <!-- ============ Regimes panel ============ -->
  <g>
    <g clip-path="url(#clipRegimes)">
      <rect x="510" y="8" width="490" height="198" fill="#ffffff"/>
      <rect x="510" y="8" width="490" height="46" fill="#eee6f8"/>
    </g>
    <text x="755" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#4c1d95">Regimes</text>
    <line x1="755" y1="70" x2="755" y2="188" stroke="#ddd0ef" stroke-width="1.3"/>

    <use href="#gear" transform="translate(630,94) scale(1.08)" fill="#5b21b6"/>
    <text x="630" y="126" text-anchor="middle" font-size="16" font-weight="800" fill="#5b21b6">Automation</text>
    <text x="630" y="148" text-anchor="middle" font-size="12" fill="#2a2e36">Focal models are tested as</text>
    <text x="630" y="164" text-anchor="middle" font-size="12" fill="#2a2e36">workers and directly solve</text>
    <text x="630" y="180" text-anchor="middle" font-size="12" fill="#2a2e36">tasks end-to-end.</text>

    <use href="#people" transform="translate(878,94) scale(1.12)" fill="#5b21b6"/>
    <text x="878" y="126" text-anchor="middle" font-size="16" font-weight="800" fill="#5b21b6">Augmentation</text>
    <text x="878" y="148" text-anchor="middle" font-size="12" fill="#2a2e36">Focal models provide assistance texts</text>
    <text x="878" y="164" text-anchor="middle" font-size="12" fill="#2a2e36">to a fixed worker model, which then</text>
    <text x="878" y="180" text-anchor="middle" font-size="12" fill="#2a2e36">produces the final task output.</text>

    <rect x="510" y="8" width="490" height="198" rx="12" fill="none" stroke="#c4b3e0" stroke-width="1.5"/>
  </g>

  <!-- ============ Pipeline title ============ -->
  <g>
    <rect x="372" y="216" width="280" height="30" rx="6" fill="#fdf6d8" stroke="#3a3a2e" stroke-width="1.3"/>
    <text x="512" y="236" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1f2430">Experiment and evaluation pipeline</text>
  </g>

  <!-- ============ Automation lane ============ -->
  <g>
    <text x="32" y="252" font-size="15.5" font-weight="800" fill="#0a3db3">Automation</text>
    <rect x="28" y="270" width="90" height="28" rx="5" fill="#dce9fb" stroke="#0a3db3" stroke-width="1.4"/>
    <text x="73" y="288.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2430">Input/tasks</text>
    <line x1="118" y1="284" x2="152" y2="284" stroke="#0a3db3" stroke-width="2" marker-end="url(#arrBlue)"/>

    <rect x="156" y="234" width="182" height="118" rx="11" fill="#ffffff"/>
    <text x="247" y="254" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a3db3">Focal models as workers</text>
    <text x="247" y="270" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a3db3">(models under test)</text>
    <use href="#person" transform="translate(204,300) scale(1.18)" fill="#0a3db3"/>
    <use href="#person" transform="translate(247,300) scale(1.18)" fill="#0a3db3"/>
    <use href="#person" transform="translate(290,300) scale(1.18)" fill="#0a3db3"/>
    <text x="247" y="330" text-anchor="middle" font-size="12" fill="#2a2e36">Worker models directly</text>
    <text x="247" y="345" text-anchor="middle" font-size="12" fill="#2a2e36">solve tasks.</text>
    <rect x="156" y="234" width="182" height="118" rx="11" fill="none" stroke="#0a3db3" stroke-width="1.7"/>

    <line x1="338" y1="294" x2="434" y2="324" stroke="#0a3db3" stroke-width="2" marker-end="url(#arrBlue)"/>
    <text x="372" y="292" font-size="12.5" font-weight="700" fill="#0a3db3">Outputs</text>
  </g>

  <!-- ============ Augmentation lane ============ -->
  <g>
    <text x="32" y="386" font-size="15.5" font-weight="800" fill="#e05a0a">Augmentation</text>
    <rect x="28" y="422" width="90" height="28" rx="5" fill="#fdf0dc" stroke="#e05a0a" stroke-width="1.4"/>
    <text x="73" y="440.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2430">Input/tasks</text>
    <line x1="118" y1="436" x2="146" y2="436" stroke="#e05a0a" stroke-width="2" marker-end="url(#arrOrange)"/>

    <rect x="150" y="364" width="220" height="180" rx="11" fill="#ffffff"/>
    <text x="210" y="383" text-anchor="middle" font-size="12" font-weight="700" fill="#e05a0a">Assistants</text>
    <text x="210" y="397" text-anchor="middle" font-size="11" fill="#e05a0a">(models under test)</text>
    <text x="332" y="383" text-anchor="middle" font-size="11" font-weight="700" fill="#e05a0a">Fixed worker</text>
    <text x="332" y="397" text-anchor="middle" font-size="11" font-weight="700" fill="#e05a0a">model</text>

    <use href="#server" transform="translate(180,414) scale(.78)" fill="#e05a0a"/>
    <use href="#server" transform="translate(180,439) scale(.78)" fill="#e05a0a"/>
    <use href="#server" transform="translate(180,464) scale(.78)" fill="#e05a0a"/>
    <use href="#server" transform="translate(180,489) scale(.78)" fill="#e05a0a"/>

    <text x="250" y="410" text-anchor="middle" font-size="10" font-style="italic" fill="#e05a0a">assistance texts</text>
    <line x1="196" y1="415" x2="308" y2="437" stroke="#e05a0a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrOrangeSm)"/>
    <line x1="196" y1="440" x2="308" y2="443" stroke="#e05a0a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrOrangeSm)"/>
    <line x1="196" y1="465" x2="308" y2="449" stroke="#e05a0a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrOrangeSm)"/>
    <line x1="196" y1="490" x2="308" y2="455" stroke="#e05a0a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrOrangeSm)"/>

    <use href="#person" transform="translate(330,446) scale(1.35)" fill="#e05a0a"/>

    <text x="260" y="520" text-anchor="middle" font-size="12" fill="#2a2e36">Assistants provide assistance texts;</text>
    <text x="260" y="535" text-anchor="middle" font-size="12" fill="#2a2e36">the worker then solves the task.</text>
    <rect x="150" y="364" width="220" height="180" rx="11" fill="none" stroke="#e05a0a" stroke-width="1.7"/>

    <line x1="370" y1="470" x2="434" y2="406" stroke="#e05a0a" stroke-width="2" marker-end="url(#arrOrange)"/>
    <text x="400" y="458" font-size="12.5" font-weight="700" fill="#e05a0a">Outputs</text>
  </g>

  <!-- ============ Evaluator ============ -->
  <g>
    <rect x="438" y="280" width="128" height="178" rx="11" fill="#ffffff"/>
    <text x="502" y="303" text-anchor="middle" font-size="15.5" font-weight="800" fill="#0a7a68">Evaluator</text>
    <use href="#gavel" transform="translate(502,332) scale(1.05)" fill="#0a7a68"/>
    <text x="502" y="364" text-anchor="middle" font-size="12" fill="#2a2e36">Blind pairwise</text>
    <text x="502" y="379" text-anchor="middle" font-size="12" fill="#2a2e36">comparison of two</text>
    <text x="502" y="394" text-anchor="middle" font-size="12" fill="#2a2e36">candidate outputs</text>
    <text x="502" y="409" text-anchor="middle" font-size="12" fill="#2a2e36">using task-specific</text>
    <text x="502" y="424" text-anchor="middle" font-size="12" fill="#2a2e36">rubrics.</text>
    <rect x="438" y="280" width="128" height="178" rx="11" fill="none" stroke="#0a8976" stroke-width="1.7"/>

    <line x1="566" y1="340" x2="696" y2="340" stroke="#0a8976" stroke-width="2" marker-end="url(#arrGreen)"/>
    <line x1="566" y1="400" x2="696" y2="400" stroke="#0a8976" stroke-width="2" marker-end="url(#arrGreen)"/>
    <text x="631" y="318" text-anchor="middle" font-size="12" fill="#2a2e36">Pairwise choice</text>
    <text x="631" y="333" text-anchor="middle" font-size="12" fill="#2a2e36">+ brief rationale</text>
    <text x="631" y="422" text-anchor="middle" font-size="12" fill="#2a2e36">Rubric scores</text>
    <text x="631" y="437" text-anchor="middle" font-size="12" font-style="italic" fill="#2a2e36">for every</text>
    <text x="631" y="452" text-anchor="middle" font-size="12" font-style="italic" fill="#2a2e36">model-task-regime</text>
  </g>

  <!-- ============ Results aggregation ============ -->
  <g>
    <rect x="702" y="258" width="296" height="268" rx="13" fill="#fffdf9"/>
    <use href="#podium" transform="translate(742,298)"/>
    <text x="786" y="298" font-size="17.5" font-weight="800" fill="#e8442a">Results aggregation</text>

    <use href="#iconMatrix" transform="translate(728,345)"/>
    <text x="752" y="340" font-size="13" font-weight="700" fill="#e8442a">Multi-judge evaluation matrix</text>
    <text x="752" y="357" font-size="12" fill="#2a2e36">Blind pairwise comparisons between outputs.</text>

    <line x1="724" y1="378" x2="976" y2="378" stroke="#f0c4b8" stroke-width="1.3" stroke-dasharray="3 3"/>

    <use href="#iconChecklist" transform="translate(728,410)"/>
    <text x="752" y="400" font-size="13" font-weight="700" fill="#e8442a">Task-specific rubric ratings</text>
    <text x="752" y="417" font-size="12" fill="#2a2e36">Along dimensions such as accuracy,</text>
    <text x="752" y="432" font-size="12" fill="#2a2e36">completeness, practicality, and tone.</text>

    <line x1="724" y1="448" x2="976" y2="448" stroke="#f0c4b8" stroke-width="1.3" stroke-dasharray="3 3"/>

    <use href="#iconChart" transform="translate(728,482)"/>
    <text x="752" y="474" font-size="13" font-weight="700" fill="#e8442a">Aggregate rankings</text>
    <text x="752" y="491" font-size="12" fill="#2a2e36">Produce average win rates and an aggregate</text>
    <text x="752" y="506" font-size="12" fill="#2a2e36">ranking matrix by model, task, and regime.</text>

    <rect x="702" y="258" width="296" height="268" rx="13" fill="none" stroke="#e8442a" stroke-width="1.8"/>
  </g>
</svg>
